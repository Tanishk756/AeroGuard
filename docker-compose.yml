# ==============================================================================
# AeroGuard Local Development Docker Compose Topology
# ==============================================================================

name: aeroguard-dev

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - AEROGUARD_ENVIRONMENT=development
      - AEROGUARD_DEBUG=true
      - AEROGUARD_DATABASE_URL=postgresql+psycopg2://aeroguard:aeroguard_dev_pass@postgres:5432/aeroguard_dev
      - AEROGUARD_RATE_LIMIT_STORAGE_URL=redis://redis:6379/0
      - AEROGUARD_RETENTION_STORAGE_PROVIDER=S3
      - AEROGUARD_S3_ENDPOINT=http://minio:9000
      - AEROGUARD_S3_BUCKET=aeroguard-archives
      - AEROGUARD_S3_ACCESS_KEY=minioadmin
      - AEROGUARD_S3_SECRET_KEY=minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - aeroguard_dev_net

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=aeroguard
      - POSTGRES_PASSWORD=aeroguard_dev_pass
      - POSTGRES_DB=aeroguard_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeroguard -d aeroguard_dev"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aeroguard_dev_net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aeroguard_dev_net

  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-08Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_dev_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aeroguard_dev_net

networks:
  aeroguard_dev_net:
    driver: bridge

volumes:
  postgres_dev_data:
  redis_dev_data:
  minio_dev_data:
