[package]
name = "aeroguard-desktop"
version = "0.1.0"
description = "AeroGuard Counter-UAS Defensive Situational Awareness Platform"
authors = ["AeroGuard Team"]
edition = "2021"

[lib]
name = "aeroguard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
